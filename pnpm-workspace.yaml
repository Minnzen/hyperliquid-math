engineStrict: true
overrides:
  # Transitive-only security pins. Each forces a dev-tool dependency onto the lowest
  # version that patches a published advisory. Drop an entry once every dependent
  # resolves to a patched version on its own; `pnpm audit` is the check.
  "brace-expansion@": 5.0.9
  # fast-uri <3.1.6: host confusion + SSRF (GHSA-jqff-g426-hqxp and 3 related).
  # Reached via @microsoft/api-extractor > @microsoft/api-extractor-model > ajv.
  "fast-uri@<3.1.6": 3.1.6
  # js-yaml <3.15.2 / <4.3.2: maxTotalMergeKeys does not limit CPU use for empty
  # merge sources (GHSA-2883-xcg3-v3hh). Reached via @changesets/cli.
  "js-yaml@^3": 3.15.2
  "js-yaml@^4": 4.3.2
  # nanoid <3.3.18: custom generators can loop indefinitely.
  # Reached via @vitest/browser-playwright > @vitest/browser > vite > postcss.
  "nanoid@<3.3.18": 3.3.18
  "postcss@<=8.5.22": 8.5.23
saveExact: true
strictPeerDependencies: true
